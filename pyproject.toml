[project]
name = "handcron"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Tomas Karabela", email = "tkarabela@seznam.cz" },
]
dependencies = [
    "croniter>=6.2.4",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg>=3.2",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.pyrefly]
preset = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
