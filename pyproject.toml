[project]
name = "handcron"
description = "Python task queue with manual ticks"
dynamic = ["version"]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Tomas Karabela", email = "tkarabela@seznam.cz" },
]
keywords = [
    "cron", "crontab", "anacron", "scheduler", "job scheduler",
    "task queue", "periodic tasks", "scheduled tasks", "batch jobs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "croniter>=6.2.4",
    "tabulate>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/tkarabela/handcron"
"Bug Tracker" = "https://github.com/tkarabela/handcron/issues"

[project.scripts]
handcron = "handcron.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg>=3.2",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE.txt"]

[tool.uv]
# Rebuild the editable install when the commit or tags change, so the version stays current
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.pyrefly]
preset = "strict"
project-excludes = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
